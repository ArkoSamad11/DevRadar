services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devradar
      POSTGRES_PASSWORD: devradar
      POSTGRES_DB: devradar
    # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devradar -d devradar"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
