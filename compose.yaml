services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devradar
      POSTGRES_PASSWORD: devradar
      POSTGRES_DB: devradar
    # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devradar -d devradar"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build: .
    command: ["sh", "-c", "devradar-migrate && exec devradar-scheduler"]
    environment:
      DATABASE_URL: postgresql://devradar:devradar@db:5432/devradar
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  pgdata:
