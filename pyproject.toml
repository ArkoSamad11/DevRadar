[project]
name = "devradar"
version = "0.1.0"
description = "Ingestion pipeline and API for tech internship postings"
readme = "README.md"
authors = [
    { name = "ArkoSamad11", email = "arkosamad9926@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
devradar-migrate = "devradar.migrate:main"
devradar-discover = "devradar.discovery.run:main"
devradar-ingest = "devradar.ingestion.worker:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]
